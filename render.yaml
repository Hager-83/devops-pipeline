# Render Blueprint — staging deployment for devops-pipeline
# ==========================================================
# NOTE: UNUSED — kept as a documented alternative. Render's signup demanded
# a credit card for identity verification (Oct 2026), so staging runs on
# Railway instead (see README → Staging Deployment).
# ----------------------------------------------------------
# The blueprint below would deploy on Render's free plan (750
# instance-hours/month, no card on file = suspension instead of charges)
# IF the account could be created without a card. It could not.
#
# Setup: Render Dashboard → New → Blueprint → connect this repo.
# Render detects the Dockerfile (EXPOSE 5000) for the listen port.
services:
  - type: web
    name: devops-pipeline-staging
    runtime: docker
    plan: free
    branch: main
    # Deploy only after the repo's CI checks pass on main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: INFO
